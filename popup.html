<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Scooper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">◡</div>
        <div>
          <h1>Page Scooper</h1>
          <p>Teach a page once. Scoop it anytime.</p>
        </div>
      </header>

      <section class="train-card">
        <div>
          <span class="eyebrow">THIS SITE</span>
          <strong id="site-status">Checking this page…</strong>
        </div>
        <button id="teach-button" class="primary">Choose what to scoop</button>
        <div id="rule-settings" class="rule-settings" hidden>
          <label class="setting-row" for="scope-select">
            <span>Run this recipe on</span>
            <select id="scope-select">
              <option value="similar">Similar pages · recommended</option>
              <option value="exact">Only this page</option>
              <option value="origin">Entire website</option>
            </select>
          </label>
          <p id="scope-hint" class="setting-hint"></p>

          <div class="workflow-setting">
            <div class="workflow-heading">
              <span>Opening steps</span>
              <small id="steps-status">Not configured</small>
            </div>
            <div class="button-row">
              <button id="record-steps-button" class="secondary" title="Start on a page where the saved content is closed">Record steps</button>
              <button id="run-steps-button" class="secondary" hidden>Run now</button>
              <button id="clear-steps-button" class="icon-button" title="Clear opening steps" hidden>×</button>
            </div>
            <label class="toggle-row">
              <input id="auto-open-toggle" type="checkbox" disabled>
              <span>Run automatically</span>
            </label>
            <p class="setting-hint">Choose controls that exist on matching pages. Their displayed text can change.</p>
          </div>
        </div>
        <button id="forget-button" class="text-button" hidden>Forget this site</button>
      </section>

      <section class="collection">
        <div class="section-heading">
          <div>
            <span class="eyebrow">COLLECTION</span>
            <h2><span id="capture-count">0</span> <span id="capture-label">scoops</span></h2>
          </div>
          <button id="clear-button" class="text-button" disabled>Clear</button>
        </div>
        <label class="copy-option">
          <input id="timestamps-toggle" type="checkbox">
          <span>Include timestamps when copying</span>
        </label>
        <div id="capture-list" class="capture-list">
          <div class="empty-state">Scooped pages will wait here until you copy them together.</div>
        </div>
        <button id="copy-button" class="copy-button" disabled>Copy everything</button>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </main>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
